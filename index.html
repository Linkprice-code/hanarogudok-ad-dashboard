<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼성하나로 구독 광고 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f6fc; --card: #ffffff; --ink: #14213d; --muted: #66728a; --line: #e2e8f4; --soft: #f5f8ff;
    --accent: #2563eb; --accent-2: #3b82f6; --accent-soft: #e8f0ff; --up: #0f9d6a; --down: #e0473c;
    --bar: #9cc0fb; --lineclr: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 14px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
  .hero { background: linear-gradient(120deg, #1d4ed8 0%, #2563eb 45%, #4f8ff7 100%); color: #fff; }
  .hero-in { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px; padding: 26px 16px 64px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .sub { color: rgba(255,255,255,.8); font-size: 12px; margin-top: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: rgba(255,255,255,.85); }
  select, input, button { font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; }
  .hero select, .hero input, .hero button { border-color: transparent; }
  button { cursor: pointer; }
  .hero #csv { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.45); }
  .panel { background: var(--card); border-radius: 16px; box-shadow: 0 6px 24px rgba(37,99,235,.08); margin: -44px 0 40px; position: relative; }
  .acc-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 500; color: var(--muted); }
  .tab:hover { border-color: var(--accent-2); color: var(--accent); }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grp { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; }
  .grp button { border: none; background: none; padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--muted); }
  .grp button.on { background: var(--card); color: var(--accent); font-weight: 700; box-shadow: 0 1px 4px rgba(20,33,61,.12); }
  #content { padding: 20px 16px 24px; min-height: 420px; }
  .notice { background: #fff7e6; border: 1px solid #f5d48a; color: #7a5200; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--soft); border-radius: 12px; padding: 14px 16px; border-top: 3px solid var(--accent-2); }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .val { font-size: 21px; font-weight: 700; margin-top: 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 400; }
  .chart-box { position: relative; height: 300px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-size: 12px; font-weight: 500; background: var(--soft); cursor: pointer; user-select: none; }
  th:hover { color: var(--accent); }
  th:first-child, td:first-child { text-align: left; }
  td:first-child { font-weight: 500; }
  tbody tr:hover { background: var(--soft); }
  tfoot td { font-weight: 700; background: var(--soft); border-bottom: none; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
  .more { display: block; margin: 12px auto 0; color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; }
</style>
</head>
<body>
<div class="hero">
  <div class="wrap hero-in">
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="sub">데이터를 불러오는 중…</div>
    </div>
    <div class="controls">
      <select id="preset">
        <option value="last7">최근 7일</option>
        <option value="last14">최근 14일</option>
        <option value="last30">최근 30일</option>
        <option value="thismonth">이번 달</option>
        <option value="lastmonth">지난 달</option>
        <option value="all">전체 기간</option>
        <option value="custom">직접 선택</option>
      </select>
      <input type="date" id="since"> ~ <input type="date" id="until">
      <button id="csv">CSV 다운로드</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="acc-tabs" id="mediaTabs"></div>
    <div id="content"></div>
  </div>
</div>

<script>
/* ---------- 설정 ---------- */
const CONFIG = {
  client: "삼성하나로 구독",
  dailyUrl: "data/daily.csv",     // 매체별 일자 데이터 (SA 행이 없으면 키워드 데이터 합계를 SA로 사용)
  keywordUrl: "data/keywords.csv", // 네이버 SA 키워드 데이터
  gfaUrl: "data/gfa.csv"           // 네이버 GFA 보고서 (게재 위치 · 연령 및 성별 포함)
};
const MEDIA = [
  { id: "sa", name: "네이버 SA", color: "#2563eb", match: /sa|검색|파워링크/i },
  { id: "gfa", name: "네이버 GFA", color: "#0f9d6a", match: /gfa|성과형|디스플레이/i },
  { id: "kakao", name: "카카오", color: "#f2a516", match: /kakao|카카오/i },
];

/* ---------- CSV 읽기 ---------- */
// 열 이름은 한글/영문 모두 인식합니다 (괄호 안 내용과 공백은 무시).
const ALIAS = {
  date: ["date", "날짜", "일자", "일별", "기간"],
  media: ["media", "매체", "채널"],
  keyword: ["keyword", "키워드", "검색어"],
  matchType: ["matchtype", "검색유형"],
  placement: ["placement", "게재위치"],
  demo: ["demo", "연령및성별"],
  spend: ["spend", "지출", "광고비", "비용", "총비용"],
  impressions: ["impressions", "노출", "노출수"],
  clicks: ["clicks", "link_clicks", "클릭", "클릭수", "링크클릭"],
  conversions: ["conversions", "전환", "전환수", "총전환수"],
};
const normHead = h => String(h).replace(/^﻿/, "").replace(/\(.*?\)/g, "").replace(/\s/g, "").toLowerCase();
const fieldOf = h => Object.keys(ALIAS).find(k => ALIAS[k].includes(normHead(h)));

function parseCsv(text) {
  const delim = text.split("\n", 1)[0].includes("\t") ? "\t" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (ch !== "\r") cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
function normDate(v) {
  const m = String(v || "").trim().match(/^(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}` : "";
}
function normMedia(v) {
  const s = String(v || "").trim();
  const hit = MEDIA.find(m => m.match.test(s));
  if (hit) return hit.id;
  if (s && !MEDIA.find(m => m.id === s)) MEDIA.push({ id: s, name: s, color: "#8b5cf6", match: /$^/ });
  return s;
}
// 엑셀에서 저장한 CSV(EUC-KR)도 읽을 수 있게 UTF-8 실패 시 EUC-KR로 다시 해석
async function loadCsv(url) {
  const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(url + " 파일을 찾을 수 없습니다 (" + res.status + ")");
  const buf = await res.arrayBuffer();
  let text;
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { text = new TextDecoder("euc-kr").decode(buf); }
  const sample = /^\s*#\s*sample/im.test(text);
  const rows = parseCsv(text.split("\n").filter(l => !l.trim().startsWith("#")).join("\n"));
  // 보고서 제목 줄 등이 위에 있어도 실제 헤더 줄을 찾아서 사용
  const hi = rows.findIndex(r => r.map(fieldOf).some(f => f === "impressions" || f === "clicks"));
  if (hi < 0) throw new Error(url + " 에서 노출/클릭 열을 찾지 못했습니다");
  const fields = rows[hi].map(fieldOf);
  const out = rows.slice(hi + 1).map(r => {
    const o = {};
    fields.forEach((f, i) => { if (f) o[f] = r[i]; });
    const kw = String(o.keyword || "").trim();
    // 키워드가 "-" 인 행은 확장 검색 노출분
    const d = { date: normDate(o.date), keyword: kw !== "-" ? kw : /확장/.test(o.matchType || "") ? "확장 검색" : "(키워드 없음)", media: o.media,
      placement: String(o.placement || "").trim(), demo: String(o.demo || "").trim() };
    for (const k of ["spend", "impressions", "clicks", "conversions"]) d[k] = num(o[k]);
    return d;
  });
  return { rows: out, sample, hasDate: fields.includes("date") };
}

/* ---------- 포맷 · 날짜 ---------- */
const fmtN = n => Math.round(n).toLocaleString("ko-KR");
const fmtW = n => "₩" + Math.round(n).toLocaleString("ko-KR");
const fmtP = n => (n * 100).toFixed(2) + "%";
const fmtS = n => (n * 100).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000) + 1;

/* ---------- 집계 ---------- */
function sum(rows) {
  const s = { spend: 0, impressions: 0, clicks: 0, conversions: 0 };
  for (const r of rows) for (const k in s) s[k] += r[k] || 0;
  s.ctr = s.impressions ? s.clicks / s.impressions : 0;
  s.cpc = s.clicks ? s.spend / s.clicks : 0;
  s.cpa = s.conversions ? s.spend / s.conversions : 0;
  return s;
}
function delta(cur, prev, inverse) {
  if (!prev) return '<span class="flat">–</span>';
  const d = (cur - prev) / prev;
  if (Math.abs(d) < 0.0005) return '<span class="flat">0.0%</span>';
  const good = inverse ? d < 0 : d > 0;
  return `<span class="${good ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d * 100).toFixed(1)}%</span>`;
}

/* ---------- 상태 ---------- */
let DAILY = [], KEYWORDS = [], GFA = [], KW_HAS_DATE = true, IS_SAMPLE = false;
let MIN = "", MAX = "";
const state = { media: "all", chart: "vol", kwSort: "spend", kwDir: -1, kwQuery: "", kwLimit: 20, mdSort: "spend", mdDir: -1, dim: {} };
let chart;

function presetRange(p) {
  const first = MAX.slice(0, 8) + "01";
  if (p === "last7") return [addDays(MAX, -6), MAX];
  if (p === "last14") return [addDays(MAX, -13), MAX];
  if (p === "last30") return [addDays(MAX, -29), MAX];
  if (p === "thismonth") return [first, MAX];
  if (p === "lastmonth") { const end = addDays(first, -1); return [end.slice(0, 8) + "01", end]; }
  if (p === "all") return [MIN, MAX];
  return null;
}
function range() {
  const since = document.getElementById("since").value, until = document.getElementById("until").value;
  const len = daysBetween(since, until);
  return { since, until, pSince: addDays(since, -len), pUntil: addDays(since, -1) };
}
const between = (r, a, b) => r.date >= a && r.date <= b;
const inMedia = r => state.media === "all" || r.media === state.media;

/* ---------- 화면 조각 ---------- */
function kpiHtml(c, p) {
  return [
    ["지출", fmtW(c.spend), delta(c.spend, p.spend)],
    ["노출", fmtN(c.impressions), delta(c.impressions, p.impressions)],
    ["링크 클릭", fmtN(c.clicks), delta(c.clicks, p.clicks)],
    ["CTR", fmtP(c.ctr), delta(c.ctr, p.ctr)],
    ["CPC", fmtW(c.cpc), delta(c.cpc, p.cpc, true)],
    ["전환수", fmtN(c.conversions), delta(c.conversions, p.conversions)],
  ].map(([l, v, d]) => `<div class="kpi"><div class="label">${l}</div><div class="val">${v}</div><div class="delta">${d}</div></div>`).join("");
}

const sortMark = (on, dir) => on ? (dir < 0 ? " ↓" : " ↑") : "";
function sortRows(rows, key, dir) {
  return rows.sort((a, b) => typeof a[key] === "string" ? dir * a[key].localeCompare(b[key], "ko") : dir * (a[key] - b[key]));
}

const KW_COLS = [
  ["keyword", "키워드", esc], ["spend", "지출", fmtW], ["impressions", "노출", fmtN], ["clicks", "클릭", fmtN],
  ["ctr", "CTR", fmtP], ["cpc", "CPC", fmtW], ["conversions", "전환수", fmtN], ["cpa", "CPA", fmtW],
];
function keywordHtml(R) {
  const src = KW_HAS_DATE ? KEYWORDS.filter(r => between(r, R.since, R.until)) : KEYWORDS;
  const by = {};
  for (const r of src) (by[r.keyword] = by[r.keyword] || []).push(r);
  let rows = Object.keys(by).map(k => Object.assign(sum(by[k]), { keyword: k }));
  const total = sum(src);
  const q = state.kwQuery.trim().toLowerCase();
  if (q) rows = rows.filter(r => r.keyword.toLowerCase().includes(q));
  sortRows(rows, state.kwSort, state.kwDir);
  const shown = rows.slice(0, state.kwLimit);
  const head = KW_COLS.map(([k, l]) => `<th data-kw="${k}">${l}${sortMark(state.kwSort === k, state.kwDir)}</th>`).join("");
  const body = shown.map(r => `<tr>${KW_COLS.map(([k, , f]) => `<td>${f(r[k])}</td>`).join("")}</tr>`).join("");
  const foot = `<tr>${KW_COLS.map(([k, , f]) => `<td>${k === "keyword" ? `합계 (${fmtN(rows.length)}개)` : f((q ? sum(rows) : total)[k])}</td>`).join("")}</tr>`;
  return `<div class="card">
    <h2>SA 키워드별 성과
      <span class="tools"><small>${KW_HAS_DATE ? R.since + " ~ " + R.until : "업로드된 전체 기간"}</small>
      <input type="search" id="kwQuery" placeholder="키워드 검색" value="${esc(state.kwQuery)}"></span>
    </h2>
    ${rows.length ? `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
    ${rows.length > shown.length ? `<button class="more" id="kwMore">더 보기 (${fmtN(rows.length - shown.length)}개 남음)</button>` : ""}`
    : `<div class="empty">해당 기간의 키워드 데이터가 없습니다.</div>`}
  </div>`;
}

// GFA 세부 표 (매체 그룹 · 게재위치 · 연령 · 성별)
function ageOf(v) {
  const m = v.match(/(\d+)세\s*~\s*(\d+)세/);
  return !m ? "알 수 없음" : +m[2] >= 99 ? m[1] + "세 이상" : m[1] + "~" + m[2] + "세";
}
const sexOf = v => /여성/.test(v) ? "여성" : /남성/.test(v) ? "남성" : "알 수 없음";
const DIMS = [
  { id: "mg", title: "매체 그룹별 성과", label: "매체 그룹", key: r => r.placement.split(">")[0].trim() || "알 수 없음" },
  { id: "pl", title: "게재위치별 성과", label: "게재위치", key: r => r.placement || "알 수 없음" },
  { id: "age", title: "연령별 성과", label: "연령", key: r => ageOf(r.demo), sort: ["name", 1] },
  { id: "sex", title: "성별 성과", label: "성별", key: r => sexOf(r.demo) },
];
const DIM_COLS = [
  ["name", "", esc], ["spend", "지출", fmtW], ["share", "비중", fmtS], ["impressions", "노출", fmtN], ["clicks", "클릭", fmtN],
  ["ctr", "CTR", fmtP], ["cpc", "CPC", fmtW], ["conversions", "전환수", fmtN], ["cpa", "CPA", fmtW],
];
function dimHtml(R) {
  const src = GFA.filter(r => between(r, R.since, R.until));
  if (!src.length) return GFA.length ? `<div class="card"><div class="empty">해당 기간의 GFA 세부 데이터가 없습니다.</div></div>` : "";
  const tot = sum(src); tot.share = tot.spend ? 1 : 0;
  return DIMS.map(d => {
    const [sk, sd] = state.dim[d.id] || d.sort || ["spend", -1];
    const by = {};
    for (const r of src) { const k = d.key(r); (by[k] = by[k] || []).push(r); }
    const rows = sortRows(Object.keys(by).map(k => { const s = sum(by[k]); return Object.assign(s, { name: k, share: tot.spend ? s.spend / tot.spend : 0 }); }), sk, sd);
    const head = DIM_COLS.map(([k, l]) => `<th data-dim="${d.id}:${k}">${l || d.label}${sortMark(sk === k, sd)}</th>`).join("");
    const body = rows.map(r => `<tr>${DIM_COLS.map(([k, , f]) => `<td>${f(r[k])}</td>`).join("")}</tr>`).join("");
    const foot = `<tr>${DIM_COLS.map(([k, , f]) => `<td>${k === "name" ? "합계" : f(tot[k])}</td>`).join("")}</tr>`;
    return `<div class="card"><h2>${d.title} <small>${R.since} ~ ${R.until}</small></h2>
      <div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div></div>`;
  }).join("");
}

const MD_COLS = [
  ["name", "매체", null], ["spend", "지출", fmtW], ["share", "비중", fmtS], ["impressions", "노출", fmtN], ["clicks", "링크클릭", fmtN],
  ["ctr", "CTR", fmtP], ["cpc", "CPC", fmtW], ["conversions", "전환수", fmtN], ["cpa", "CPA", fmtW],
];
function mediaHtml(R) {
  const cur = DAILY.filter(r => between(r, R.since, R.until)), prev = DAILY.filter(r => between(r, R.pSince, R.pUntil));
  const tot = sum(cur), ptot = sum(prev);
  const rows = MEDIA.map(m => {
    const s = sum(cur.filter(r => r.media === m.id)), p = sum(prev.filter(r => r.media === m.id));
    return Object.assign(s, { name: m.name, color: m.color, share: tot.spend ? s.spend / tot.spend : 0, d1: delta(s.spend, p.spend), d2: delta(s.conversions, p.conversions) });
  });
  sortRows(rows, state.mdSort, state.mdDir);
  tot.share = tot.spend ? 1 : 0;
  const cell = (r, k, f) => k === "name" ? `<span class="dot" style="background:${r.color}"></span>${esc(r.name)}` : f(r[k]);
  const head = MD_COLS.map(([k, l]) => `<th data-md="${k}">${l}${sortMark(state.mdSort === k, state.mdDir)}</th>`).join("") + "<th>지출 증감</th><th>전환수 증감</th>";
  const body = rows.map(r => `<tr>${MD_COLS.map(([k, , f]) => `<td>${cell(r, k, f)}</td>`).join("")}<td>${r.d1}</td><td>${r.d2}</td></tr>`).join("");
  const foot = `<tr>${MD_COLS.map(([k, , f]) => `<td>${k === "name" ? "합계" : f(tot[k])}</td>`).join("")}<td>${delta(tot.spend, ptot.spend)}</td><td>${delta(tot.conversions, ptot.conversions)}</td></tr>`;
  return `<div class="card"><h2>매체별 성과 <small>비교: ${R.pSince} ~ ${R.pUntil}</small></h2>
    <div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div></div>`;
}

function drawChart(R, cur) {
  const days = []; for (let d = R.since; d <= R.until; d = addDays(d, 1)) days.push(d);
  const per = days.map(d => sum(cur.filter(r => r.date === d)));
  const labels = days.map(d => d.slice(5).replace("-", "/"));
  const line = (label, data, extra) => Object.assign({ type: "line", label, data, borderColor: "#1d4ed8", backgroundColor: "#1d4ed8", borderWidth: 2, pointRadius: days.length > 31 ? 0 : 3, tension: 0.25 }, extra);
  let datasets, scales, tip;
  const grid = { color: "#eef2f9" };
  if (state.chart === "vol") {
    datasets = [line("링크 클릭", per.map(s => s.clicks), { yAxisID: "y" }),
      { type: "bar", label: "노출", data: per.map(s => s.impressions), backgroundColor: "#9cc0fb", borderRadius: 4, yAxisID: "y1" }];
    scales = { y: { position: "left", beginAtZero: true, grid, title: { display: true, text: "클릭" } },
      y1: { position: "right", beginAtZero: true, grid: { display: false }, title: { display: true, text: "노출" } } };
    tip = v => fmtN(v);
  } else if (state.chart === "ctr") {
    datasets = [line("CTR", per.map(s => s.ctr * 100))];
    scales = { y: { beginAtZero: true, grid, ticks: { callback: v => v + "%" } } };
    tip = v => v.toFixed(2) + "%";
  } else {
    datasets = [line("CPC", per.map(s => s.cpc))];
    scales = { y: { beginAtZero: true, grid, ticks: { callback: v => "₩" + fmtN(v) } } };
    tip = v => fmtW(v);
  }
  scales.x = { grid: { display: false } };
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("trend"), {
    data: { labels, datasets },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false }, scales,
      plugins: { legend: { position: "top" }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${tip(c.parsed.y)}` } } } },
  });
}

function render() {
  const R = range();
  document.getElementById("mediaTabs").innerHTML = [{ id: "all", name: "전체" }].concat(MEDIA)
    .map(m => `<button class="tab${state.media === m.id ? " on" : ""}" data-media="${esc(m.id)}">${esc(m.name)}</button>`).join("");
  const cur = DAILY.filter(r => inMedia(r) && between(r, R.since, R.until));
  const prev = DAILY.filter(r => inMedia(r) && between(r, R.pSince, R.pUntil));
  const showKw = state.media === "all" || state.media === "sa";
  const modes = [["vol", "노출·클릭"], ["ctr", "CTR"], ["cpc", "CPC"]];
  document.getElementById("content").innerHTML =
    (IS_SAMPLE ? `<div class="notice">⚠ 현재 화면은 <b>샘플 데이터</b>입니다. data 폴더의 CSV를 실제 데이터로 교체하면 이 안내는 사라집니다.</div>` : "") +
    `<div class="kpis">${kpiHtml(sum(cur), sum(prev))}</div>
    <div class="card"><h2>유입 추이
      <span class="grp">${modes.map(([k, l]) => `<button data-chart="${k}" class="${state.chart === k ? "on" : ""}">${l}</button>`).join("")}</span></h2>
      <div class="chart-box"><canvas id="trend"></canvas></div></div>` +
    (showKw ? keywordHtml(R) : "") + (state.media === "gfa" ? dimHtml(R) : "") + mediaHtml(R);
  drawChart(R, cur);
}

/* ---------- 이벤트 ---------- */
function setPreset(p) {
  const r = presetRange(p); if (!r) return;
  document.getElementById("since").value = r[0] < MIN ? MIN : r[0];
  document.getElementById("until").value = r[1];
}
document.getElementById("preset").addEventListener("change", e => { setPreset(e.target.value); render(); });
for (const id of ["since", "until"]) document.getElementById(id).addEventListener("change", () => {
  const s = document.getElementById("since"), u = document.getElementById("until");
  if (!s.value || !u.value) return;
  if (s.value > u.value) (id === "since" ? u : s).value = (id === "since" ? s : u).value;
  document.getElementById("preset").value = "custom"; render();
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-media],[data-chart],[data-kw],[data-md],[data-dim],#kwMore"); if (!t) return;
  if (t.dataset.media) state.media = t.dataset.media;
  else if (t.dataset.chart) state.chart = t.dataset.chart;
  else if (t.dataset.kw) { const k = t.dataset.kw; if (state.kwSort === k) state.kwDir *= -1; else { state.kwSort = k; state.kwDir = k === "keyword" ? 1 : -1; } }
  else if (t.dataset.md) { const k = t.dataset.md; if (state.mdSort === k) state.mdDir *= -1; else { state.mdSort = k; state.mdDir = k === "name" ? 1 : -1; } }
  else if (t.dataset.dim) {
    const [id, k] = t.dataset.dim.split(":"), cur = state.dim[id] || DIMS.find(d => d.id === id).sort || ["spend", -1];
    state.dim[id] = cur[0] === k ? [k, -cur[1]] : [k, k === "name" ? 1 : -1];
  }
  else state.kwLimit += 30;
  render();
});
document.addEventListener("input", e => {
  if (e.target.id !== "kwQuery") return;
  state.kwQuery = e.target.value; state.kwLimit = 20; render();
  const q = document.getElementById("kwQuery"); q.focus(); q.setSelectionRange(q.value.length, q.value.length);
});
document.getElementById("csv").addEventListener("click", () => {
  const R = range(), name = id => (MEDIA.find(m => m.id === id) || { name: id }).name;
  const rows = DAILY.filter(r => inMedia(r) && between(r, R.since, R.until)).sort((a, b) => a.date.localeCompare(b.date));
  const lines = ["날짜,매체,지출,노출,클릭,CTR,CPC,전환수"].concat(rows.map(r =>
    [r.date, name(r.media), Math.round(r.spend), r.impressions, r.clicks,
      r.impressions ? (r.clicks / r.impressions * 100).toFixed(2) + "%" : "0%", r.clicks ? Math.round(r.spend / r.clicks) : 0, r.conversions].join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" }));
  a.download = `${CONFIG.client}_${R.since}_${R.until}.csv`; a.click();
});

/* ---------- 시작 ---------- */
document.getElementById("title").textContent = CONFIG.client + " 광고 리포트";
(async function init() {
  try {
    const d = await loadCsv(CONFIG.dailyUrl);
    DAILY = d.rows.filter(r => r.date).map(r => Object.assign(r, { media: normMedia(r.media) }));
    let k = { rows: [], sample: false, hasDate: true };
    try { k = await loadCsv(CONFIG.keywordUrl); } catch (e) { console.warn(e); }
    KW_HAS_DATE = k.hasDate;
    KEYWORDS = k.rows.filter(r => r.keyword && (!KW_HAS_DATE || r.date));
    // daily.csv에 SA 행이 없으면 키워드 데이터를 SA 일자 데이터로 사용
    if (KW_HAS_DATE && !DAILY.some(r => r.media === "sa")) DAILY = DAILY.concat(KEYWORDS.map(r => Object.assign({}, r, { media: "sa" })));
    // daily.csv에 GFA 행이 없으면 GFA 보고서를 GFA 일자 데이터로 사용
    try { const g = await loadCsv(CONFIG.gfaUrl); GFA = g.rows.filter(r => r.date); IS_SAMPLE = IS_SAMPLE || g.sample; } catch (e) { console.warn(e); }
    if (!DAILY.some(r => r.media === "gfa")) DAILY = DAILY.concat(GFA.map(r => Object.assign({}, r, { media: "gfa" })));
    if (!DAILY.length) throw new Error("날짜가 있는 데이터가 없습니다");
    IS_SAMPLE = IS_SAMPLE || d.sample || k.sample;
    const dates = DAILY.map(r => r.date).sort();
    MIN = dates[0]; MAX = dates[dates.length - 1];
    for (const id of ["since", "until"]) { const el = document.getElementById(id); el.min = MIN; el.max = MAX; }
    document.getElementById("sub").textContent = `데이터 기간: ${MIN} ~ ${MAX} · 네이버 SA · 네이버 GFA · 카카오`;
    setPreset("last7");
    render();
  } catch (e) {
    document.getElementById("sub").textContent = "데이터를 불러오지 못했습니다";
    document.getElementById("content").innerHTML = `<div class="empty">${esc(e.message)}<br><br>index.html을 더블클릭해서 열면 CSV를 읽을 수 없습니다. GitHub Pages에 올린 주소로 확인해 주세요.</div>`;
  }
})();
</script>
